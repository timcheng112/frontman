name: Generate Weekly Digest

on:
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:
    inputs:
      date:
        description: "Optional publication date in YYYY-MM-DD"
        required: false
        type: string
      lookback_days:
        description: "How many days of source items to consider"
        required: false
        default: "7"
        type: string
      model:
        description: "OpenAI model to use for ranking and writing"
        required: false
        default: "gpt-5.4-mini"
        type: string
      reasoning_effort:
        description: "Reasoning effort for the Responses API"
        required: false
        default: "low"
        type: choice
        options:
          - none
          - minimal
          - low
          - medium
          - high
          - xhigh
      max_items:
        description: "Maximum number of ranked stories to include"
        required: false
        default: "5"
        type: string
      force:
        description: "Override the duplicate-week safeguard"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: frontman-weekly-digest
  cancel-in-progress: false

env:
  SITE_URL: ${{ vars.SITE_URL }}
  BASE_PATH: ${{ vars.BASE_PATH }}

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
      digest_path: ${{ steps.digest.outputs.path }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build generator args
        id: args
        env:
          INPUT_DATE: ${{ github.event.inputs.date || '' }}
          INPUT_LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '7' }}
          INPUT_MODEL: ${{ github.event.inputs.model || 'gpt-5.4-mini' }}
          INPUT_REASONING_EFFORT: ${{ github.event.inputs.reasoning_effort || 'low' }}
          INPUT_MAX_ITEMS: ${{ github.event.inputs.max_items || '5' }}
          INPUT_FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          args="--skip-if-exists"

          if [ -n "$INPUT_DATE" ]; then
            args="$args --date $INPUT_DATE"
          fi

          args="$args --lookback-days $INPUT_LOOKBACK_DAYS"
          args="$args --model $INPUT_MODEL"
          args="$args --reasoning-effort $INPUT_REASONING_EFFORT"
          args="$args --max-items $INPUT_MAX_ITEMS"

          if [ "$INPUT_FORCE" = "true" ]; then
            args="${args/--skip-if-exists/}"
            args="$args --force"
          fi

          echo "value=$args" >> "$GITHUB_OUTPUT"

      - name: Generate LLM digest
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FRONTMAN_OPENAI_MODEL: ${{ vars.FRONTMAN_OPENAI_MODEL || 'gpt-5.4-mini' }}
          RUN_ARGS: ${{ steps.args.outputs.value }}
        run: npm run generate:digest:llm -- $RUN_ARGS

      - name: Validate digest content
        run: npm run validate:digests

      - name: Detect content changes
        id: changes
        run: |
          if git status --short -- src/content/digests | grep . >/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Capture generated digest path
        id: digest
        if: steps.changes.outputs.changed == 'true'
        run: |
          digest_path="$(git status --short -- src/content/digests | awk '{print $2}' | head -n 1)"
          echo "path=$digest_path" >> "$GITHUB_OUTPUT"

      - name: Commit generated digest
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/digests

          digest_path="$(git diff --cached --name-only -- src/content/digests | head -n 1)"
          digest_name="$(basename "$digest_path" .md)"
          git commit -m "chore: publish digest ${digest_name}"

      - name: Push generated digest
        if: steps.changes.outputs.changed == 'true'
        run: git push

  build:
    needs: generate
    if: needs.generate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Install, build, and upload site
        uses: withastro/action@v6

  deploy:
    needs: [generate, build]
    if: needs.generate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  notify:
    needs: [generate, deploy]
    if: needs.generate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build notification URL
        id: notification
        env:
          DIGEST_PATH: ${{ needs.generate.outputs.digest_path }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          digest_slug="$(basename "$DIGEST_PATH" .md)"
          page_url="${PAGE_URL%/}/"
          echo "url=${page_url}digests/${digest_slug}/" >> "$GITHUB_OUTPUT"

      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FRONTMAN_DIGEST_PATH: ${{ needs.generate.outputs.digest_path }}
          FRONTMAN_DIGEST_URL: ${{ steps.notification.outputs.url }}
        run: npm run notify:telegram
        if: ${{ secrets.TELEGRAM_BOT_TOKEN != '' && secrets.TELEGRAM_CHAT_ID != '' }}

      - name: Skip Telegram notification
        if: ${{ secrets.TELEGRAM_BOT_TOKEN == '' || secrets.TELEGRAM_CHAT_ID == '' }}
        run: echo "Skipping Telegram notification because TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is not configured."
